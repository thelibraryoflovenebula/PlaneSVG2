        <h1 id="change" class="bruh"> Clouds Eater </h1>
        
        <main class="two">

            <div class="container">

                    <div class="col-2 buttons">

        <main class="one"> <!-- where all the svg stuff is going to be happening-->
            <svg class="afternoonState" id="skyWindow" width="1000" height="400">
